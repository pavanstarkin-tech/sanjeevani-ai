  <!-- Firebase Web SDK for Real Google Sign-In Popup with COOP Fallback -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCU7Psyt8Rl5kQScIDAavvleuyNjkhVFxo",
      authDomain: "healthexpress-1.firebaseapp.com",
      projectId: "healthexpress-1",
      storageBucket: "healthexpress-1.firebasestorage.app",
      messagingSenderId: "575738669292",
      appId: "1:575738669292:web:305a1fce4415b605c3ddc9",
      measurementId: "G-11RHHGM6T0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({
      prompt: 'select_account'
    });

    window.triggerFirebaseGoogleSignIn = function() {
      return new Promise((resolve) => {
        let isDone = false;

        function finishSuccess(user, idToken) {
          if (isDone) return;
          isDone = true;
          if (authUnsub) authUnsub();
          resolve(JSON.stringify({
            success: true,
            uid: user.uid,
            email: user.email,
            displayName: user.displayName || (user.email ? user.email.split('@')[0] : 'Google User'),
            photoURL: user.photoURL || '',
            idToken: idToken || ''
          }));
        }

        function finishError(code, message) {
          if (isDone) return;
          isDone = true;
          if (authUnsub) authUnsub();
          resolve(JSON.stringify({
            success: false,
            code: code || 'error',
            message: message || 'Google Sign-In failed.'
          }));
        }

        // 1. Listen for auth state change - fires immediately when OAuth handshake completes,
        // even if mobile browser COOP policy delays or blocks popup.closed checks!
        const authUnsub = onAuthStateChanged(auth, async (user) => {
          if (user && !isDone) {
            try {
              const idToken = await user.getIdToken();
              finishSuccess(user, idToken);
            } catch (e) {
              finishSuccess(user, '');
            }
          }
        });

        // 2. Trigger Google Sign-In Popup
        signInWithPopup(auth, provider).then(async (result) => {
          if (!isDone) {
            const user = result.user;
            const idToken = await user.getIdToken();
            finishSuccess(user, idToken);
          }
        }).catch((error) => {
          if (isDone) return;

          let msg = error.message || '';
          if (error.code === 'auth/popup-closed-by-user') {
            msg = 'Google Sign-In popup was closed before completing login.';
          } else if (error.code === 'auth/popup-blocked') {
            msg = 'The Google sign-in popup was blocked by your browser. Please allow popups for this site.';
          } else if (error.code === 'auth/unauthorized-domain' || (msg && msg.includes('unauthorized-domain'))) {
            msg = 'Domain not authorized in Firebase. Please ensure pavanstarkin-tech.github.io is added to Firebase Console -> Authentication -> Settings -> Authorized domains.';
          }
          finishError(error.code, msg);
        });

        // 3. Safety timeout of 45s if mobile tab hangs without user interaction
        setTimeout(() => {
          if (!isDone) {
            // Check if current user is already authenticated
            if (auth.currentUser) {
              finishSuccess(auth.currentUser, '');
            } else {
              finishError('timeout', 'Google Sign-In took too long. Please try again.');
            }
          }
        }, 45000);
      });
    };

    // HealthExpress Real Web Speech Recognition & Synthesis for AI Assistant
    window.healthExpressSpeech = {
      recognition: null,
      isListening: false,
      lastTranscript: '',
      interimTranscript: '',
      silenceTimer: null,
      silenceCutoffTriggered: false,
      lastSpeechTimestamp: 0,
      hasSpoken: false,
      speechJustEnded: false,

      isSilenceCutoffTriggered: function() {
        if (this.silenceCutoffTriggered) {
          this.silenceCutoffTriggered = false;
          return true;
        }
        if (this.isListening && this.hasSpoken && this.lastSpeechTimestamp > 0 && (Date.now() - this.lastSpeechTimestamp > 1400) && this.lastTranscript && this.lastTranscript.trim().length >= 3) {
          this.hasSpoken = false;
          this.lastSpeechTimestamp = 0;
          return true;
        }
        return false;
      },

      isSpeechJustEnded: function() {
        if (this.speechJustEnded) {
          this.speechJustEnded = false;
          return true;
        }
        return false;
      },

      getLiveInterim: function() {
        return this.interimTranscript || this.lastTranscript || '';
      },

      isExplicitlyActive: false,

      startListening: function(lang, callback) {
        try {
          if (this.isSpeakingNow()) {
            console.log('AI speech is active. Postponing speech recognition start.');
            if (callback) callback('speaking');
            return;
          }
          this.isExplicitlyActive = true;
          this.lastTranscript = '';
          this.interimTranscript = '';
          this.silenceCutoffTriggered = false;
          this.hasSpoken = false;
          this.lastSpeechTimestamp = 0;
          if (this.silenceTimer) clearTimeout(this.silenceTimer);

          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRecognition) {
            console.warn('Speech Recognition not supported in this browser');
            if (callback) callback('error:not_supported');
            return;
          }
          if (this.recognition) {
            try { this.recognition.abort(); } catch (_) {}
          }
          const rec = new SpeechRecognition();
          rec.lang = lang || 'en-IN';
          rec.continuous = true;
          rec.interimResults = true;
          rec.maxAlternatives = 1;

          rec.onstart = () => {
            this.isListening = true;
            this.hasSpoken = false;
            if (window.onSpeechEvent) window.onSpeechEvent('start', '');
          };

          rec.onresult = (event) => {
            if (this.isSpeakingNow()) {
              return;
            }
            let interim = '';
            let final = '';
            for (let i = 0; i < event.results.length; ++i) {
              const res = event.results[i];
              if (res.isFinal) {
                final += res[0].transcript + ' ';
              } else {
                interim += res[0].transcript;
              }
            }
            const current = (final + interim).trim();
            if (current.length > 0) {
              this.lastTranscript = current;
              this.interimTranscript = current;
              this.hasSpoken = true;
              this.lastSpeechTimestamp = Date.now();

              if (window.onSpeechEvent) window.onSpeechEvent('result', this.lastTranscript);

              // Real-Time Voice Activity Detection (VAD) Auto-Cut:
              // Whenever user speaks and gives a natural 1.4s gap, auto-cut & process!
              if (this.silenceTimer) clearTimeout(this.silenceTimer);
              this.silenceTimer = setTimeout(() => {
                if (this.isListening && this.hasSpoken && this.lastTranscript && this.lastTranscript.trim().length > 0 && !this.isSpeakingNow()) {
                  console.log("⚡ VAD Auto-Cut: User finished speaking. Processing response instantly!", this.lastTranscript);
                  this.silenceCutoffTriggered = true;
                  if (window.onSpeechSilenceCutoff) {
                    window.onSpeechSilenceCutoff(this.lastTranscript);
                  }
                }
              }, 1400);
            }
          };

          rec.onerror = (event) => {
            console.warn('Speech recognition event:', event.error);
            if (event.error === 'no-speech' || event.error === 'network') {
              // Never abort listening on momentary pause / no-speech; keep listening seamlessly!
              if (this.isExplicitlyActive && !this.isSpeakingNow() && !this.silenceCutoffTriggered) {
                try { rec.start(); } catch (_) {}
              }
            } else {
              this.isListening = false;
            }
            if (window.onSpeechEvent) window.onSpeechEvent('error', event.error || 'speech_error');
          };

          rec.onend = () => {
            // Keep listening continuously in call mode without cutting off at browser 5-second default limit
            if (this.isExplicitlyActive && !this.isSpeakingNow() && !this.silenceCutoffTriggered) {
              try {
                rec.start();
                this.isListening = true;
              } catch (_) {}
            } else {
              this.isListening = false;
              if (window.onSpeechEvent) window.onSpeechEvent('end', this.lastTranscript);
            }
          };

          this.recognition = rec;
          rec.start();
        } catch (e) {
          console.error('Speech recognition error:', e);
          if (window.onSpeechEvent) window.onSpeechEvent('error', e.message);
        }
      },

      stopListening: function() {
        this.isExplicitlyActive = false;
        if (this.silenceTimer) clearTimeout(this.silenceTimer);
        if (this.recognition) {
          try { this.recognition.stop(); } catch (_) {}
          this.isListening = false;
        }
        return this.lastTranscript;
      },

      currentAudio: null,
      isSpeaking: false,

      isSpeakingNow: function() {
        return this.isSpeaking || (window.speechSynthesis && window.speechSynthesis.speaking);
      },

      speak: function(text, lang) {
        return this.speakText(text, lang);
      },

      speakText: async function(text, lang, apiKey) {
        try {
          this.stopSpeaking();
          if (!text || !text.trim()) return;

          this.isSpeaking = true;
          // Immediately stop microphone capture so AI audio is not recorded from speakers
          this.stopListening();

          // Clean markdown formatting, symbols, emojis, and links for natural clinical pronunciation
          const cleanText = text
            .replace(/\*\*/g, '')
            .replace(/###/g, '')
            .replace(/##/g, '')
            .replace(/#/g, '')
            .replace(/\*/g, '')
            .replace(/`+/g, '')
            .replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1')
            .replace(/[\u{1F600}-\u{1F64F}|\u{1F300}-\u{1F5FF}|\u{1F680}-\u{1F6FF}|\u{1F1E0}-\u{1F1FF}|\u{2600}-\u{26FF}|\u{2700}-\u{27BF}]/gu, '')
            .trim();

          if (!cleanText) {
            this.isSpeaking = false;
            return;
          }

          const rawKeys = apiKey ? (apiKey.includes(',') ? apiKey.split(',') : [apiKey]) : ['sk_5ijbsyhu_co3XmcxZMgr0Rf0HAjfWvV4x', 'sk_d3mrjqmd_WCMwFkKIf6GQKxpaUIu9Ucwu'];
          const keys = rawKeys.map(k => k.trim()).filter(Boolean);
          if (!keys.includes('sk_d3mrjqmd_WCMwFkKIf6GQKxpaUIu9Ucwu')) {
            keys.push('sk_d3mrjqmd_WCMwFkKIf6GQKxpaUIu9Ucwu');
          }
          let targetLang = 'en-IN';
          if (lang) {
            const l = lang.toLowerCase();
            if (l.includes('te')) targetLang = 'te-IN';
            else if (l.includes('hi')) targetLang = 'hi-IN';
            else if (l.includes('ta')) targetLang = 'ta-IN';
            else if (l.includes('kn')) targetLang = 'kn-IN';
            else if (l.includes('ml')) targetLang = 'ml-IN';
            else if (l.includes('bn')) targetLang = 'bn-IN';
            else if (l.includes('mr')) targetLang = 'mr-IN';
            else if (l.includes('gu')) targetLang = 'gu-IN';
            else if (l.includes('pa')) targetLang = 'pa-IN';
            else if (l.includes('od') || l.includes('or')) targetLang = 'od-IN';
          }
          
          // Auto-detect script in text as primary truth for TTS voice & pronunciation
          if (/[\u0C00-\u0C7F]/.test(cleanText)) {
            targetLang = 'te-IN';
          } else if (/[\u0B80-\u0BFF]/.test(cleanText)) {
            targetLang = 'ta-IN';
          } else if (/[\u0C80-\u0CFF]/.test(cleanText)) {
            targetLang = 'kn-IN';
          } else if (/[\u0D00-\u0D7F]/.test(cleanText)) {
            targetLang = 'ml-IN';
          } else if (/[\u0980-\u09FF]/.test(cleanText)) {
            targetLang = 'bn-IN';
          } else if (/[\u0A80-\u0AFF]/.test(cleanText)) {
            targetLang = 'gu-IN';
          } else if (/[\u0A00-\u0A7F]/.test(cleanText)) {
            targetLang = 'pa-IN';
          } else if (/[\u0B00-\u0B7F]/.test(cleanText)) {
            targetLang = 'od-IN';
          } else if (/[\u0900-\u097F]/.test(cleanText)) {
            targetLang = (targetLang === 'mr-IN') ? 'mr-IN' : 'hi-IN';
          }
          
          // Realistic Indian Clinical Voice Selection for Sarvam bulbul:v3
          // All speakers verified against Sarvam AI API valid catalog:
          let speakerVoice = 'priya';
          if (targetLang === 'te-IN') speakerVoice = 'kavitha';
          else if (targetLang === 'hi-IN') speakerVoice = 'kavya';
          else if (targetLang === 'ta-IN') speakerVoice = 'shruti';
          else if (targetLang === 'kn-IN') speakerVoice = 'roopa';
          else if (targetLang === 'ml-IN') speakerVoice = 'suhani';
          else if (targetLang === 'bn-IN') speakerVoice = 'shreya';
          else if (targetLang === 'mr-IN') speakerVoice = 'rupali';
          else if (targetLang === 'gu-IN') speakerVoice = 'pooja';
          else if (targetLang === 'pa-IN') speakerVoice = 'simran';
          else if (targetLang === 'od-IN' || targetLang === 'or-IN') speakerVoice = 'shreya';

          // Sarvam Bulbul v3 Indian AI Voice Synthesis (Ultra-realistic, HD 22050 Hz)
          let sarvamAudioPlayed = false;
          for (const key of keys) {
            if (sarvamAudioPlayed) break;
            try {
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), 15000);

              const res = await fetch('https://api.sarvam.ai/text-to-speech', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'api-subscription-key': key
                },
                body: JSON.stringify({
                  inputs: [cleanText.length > 500 ? cleanText.substring(0, 500) : cleanText],
                  target_language_code: targetLang,
                  speaker: speakerVoice,
                  pitch: 0,
                  pace: 1.05,
                  loudness: 1.5,
                  speech_sample_rate: 22050,
                  enable_preprocessing: true,
                  model: 'bulbul:v3'
                }),
                signal: controller.signal
              });
              clearTimeout(timeoutId);

              if (res.ok) {
                const data = await res.json();
                if (data && data.audios && data.audios.length > 0 && data.audios[0]) {
                  const audio = new Audio("data:audio/wav;base64," + data.audios[0]);
                  this.currentAudio = audio;
                  this.isSpeaking = true;
                  audio.onended = () => {
                    this.isSpeaking = false;
                    this.currentAudio = null;
                    this.speechJustEnded = true;
                    if (window.onSpeechEvent) window.onSpeechEvent('speaking_end', '');
                  };
                  audio.onerror = () => {
                    this.isSpeaking = false;
                    this.currentAudio = null;
                    this._fallbackWebSpeech(cleanText, targetLang);
                  };
                  await audio.play();
                  sarvamAudioPlayed = true;
                  break;
                }
              }
            } catch (sarvamErr) {
              console.warn('Sarvam TTS notice for key, trying next fallback key:', sarvamErr);
            }
          }

          // Seamless fallback to browser Web SpeechSynthesis if Sarvam is unavailable or busy
          if (!sarvamAudioPlayed) {
            this._fallbackWebSpeech(cleanText, targetLang);
          }
        } catch (e) {
          this.isSpeaking = false;
          console.error('TTS error:', e);
        }
      },

      _fallbackWebSpeech: function(cleanText, lang) {
        try {
          if (!window.speechSynthesis) return;
          window.speechSynthesis.cancel();

          const utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.lang = lang || 'en-IN';
          utterance.rate = 1.05;
          utterance.pitch = 1.0;

          // Strictly select Lady Voice for speech synthesis
          const voices = window.speechSynthesis.getVoices();
          if (voices && voices.length > 0) {
            const femaleMatch = voices.find(v => {
              const name = (v.name || '').toLowerCase();
              const langMatch = v.lang.startsWith(lang || 'en') || v.lang.includes('IN') || name.includes('india');
              const isFemale = name.includes('female') || name.includes('zira') || name.includes('veena') || name.includes('heera') || name.includes('neerja') || name.includes('swara') || name.includes('kalpana') || name.includes('samantha') || name.includes('karen') || name.includes('victoria') || name.includes('google हिन्दी') || name.includes('google telugu') || name.includes('natural');
              return langMatch && isFemale;
            }) || voices.find(v => {
              const name = (v.name || '').toLowerCase();
              return !name.includes('david') && !name.includes('george') && !name.includes('rishi') && !name.includes('ravi') && !name.includes('mark') && !name.includes('male') && (v.lang.startsWith(lang || 'en') || v.lang.includes('IN'));
            });
            if (femaleMatch) utterance.voice = femaleMatch;
          }

          utterance.onstart = () => { this.isSpeaking = true; };
          utterance.onend = () => {
            this.isSpeaking = false;
            this.speechJustEnded = true;
            if (window.onSpeechEvent) window.onSpeechEvent('speaking_end', '');
          };
          utterance.onerror = () => { this.isSpeaking = false; };

          window.speechSynthesis.speak(utterance);
        } catch (e) {
          console.error('Web Speech fallback error:', e);
        }
      },

      stopSpeaking: function() {
        this.isSpeaking = false;
        if (this.currentAudio) {
          try {
            this.currentAudio.pause();
            this.currentAudio.currentTime = 0;
          } catch (_) {}
          this.currentAudio = null;
        }
        if (window.speechSynthesis) {
          try { window.speechSynthesis.cancel(); } catch (_) {}
        }
      }
    };

    // Sarvam Live Voice Assistant Audio Recorder & Real-Time STT (saaras:v3)
    window.sarvamLiveAudioRecorder = {
      mediaStream: null,
      audioContext: null,
      processor: null,
      input: null,
      pcmData: [],
      isRecording: false,
      hasVoiceEnergy: false,
      lastVoiceEnergyTime: 0,

      startRecording: async function(lang) {
        try {
          if (window.healthExpressSpeech && window.healthExpressSpeech.isSpeakingNow()) {
            console.log('AI speech is currently playing. Deferring mic capture.');
            return JSON.stringify({ success: false, isSpeaking: true });
          }
          this.pcmData = [];
          this.hasVoiceEnergy = false;
          this.lastVoiceEnergyTime = 0;
          if (window.healthExpressSpeech) {
            window.healthExpressSpeech.silenceCutoffTriggered = false;
            window.healthExpressSpeech.hasSpoken = false;
            window.healthExpressSpeech.lastSpeechTimestamp = 0;
            window.healthExpressSpeech.lastTranscript = '';
            window.healthExpressSpeech.interimTranscript = '';
            window.healthExpressSpeech.startListening(lang || 'en-IN');
          }

          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                  channelCount: 1,
                  sampleRate: 16000,
                  echoCancellation: true,
                  noiseSuppression: true
                }
              });
              this.mediaStream = stream;

              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (AudioCtx) {
                this.audioContext = new AudioCtx({ sampleRate: 16000 });
                if (this.audioContext.state === 'suspended') {
                  await this.audioContext.resume();
                }

                this.input = this.audioContext.createMediaStreamSource(stream);
                this.processor = this.audioContext.createScriptProcessor(4096, 1, 1);
                this.processor.onaudioprocess = (e) => {
                  if (!this.isRecording) return;
                  const channel = e.inputBuffer.getChannelData(0);
                  this.pcmData.push(new Float32Array(channel));

                  // Real-time audio energy VAD
                  let sum = 0;
                  for (let i = 0; i < channel.length; i++) {
                    sum += channel[i] * channel[i];
                  }
                  const rms = Math.sqrt(sum / channel.length);
                  if (rms > 0.015) {
                    this.hasVoiceEnergy = true;
                    this.lastVoiceEnergyTime = Date.now();
                  } else if (this.hasVoiceEnergy && this.lastVoiceEnergyTime > 0 && (Date.now() - this.lastVoiceEnergyTime > 1400) && this.pcmData.length > 12) {
                    if (window.healthExpressSpeech && window.healthExpressSpeech.lastTranscript && window.healthExpressSpeech.lastTranscript.trim().length >= 3) {
                      window.healthExpressSpeech.silenceCutoffTriggered = true;
                    }
                  }
                };

                // Connect to a silent gain node to prevent raw microphone audio loopback into speakers while recording
                const muteGain = this.audioContext.createGain();
                muteGain.gain.value = 0;
                this.input.connect(this.processor);
                this.processor.connect(muteGain);
                muteGain.connect(this.audioContext.destination);
              }
            } catch (micErr) {
              console.warn('Microphone stream initialization note:', micErr);
            }
          }

          this.isRecording = true;
          return JSON.stringify({ success: true });
        } catch (err) {
          console.error('Sarvam mic recording error:', err);
          return JSON.stringify({ success: false, error: err.message || err.toString() });
        }
      },

      stopAndTranscribe: async function(apiKey, langCode) {
        return new Promise(async (resolve) => {
          try {
            this.isRecording = false;

            let webSpeechTranscript = '';
            if (window.healthExpressSpeech) {
              webSpeechTranscript = window.healthExpressSpeech.stopListening() || '';
            }

            if (this.processor) {
              try { this.processor.disconnect(); } catch (_) {}
              this.processor = null;
            }
            if (this.input) {
              try { this.input.disconnect(); } catch (_) {}
              this.input = null;
            }
            if (this.mediaStream) {
              try { this.mediaStream.getTracks().forEach(t => t.stop()); } catch (_) {}
              this.mediaStream = null;
            }
            if (this.audioContext && this.audioContext.state !== 'closed') {
              try { await this.audioContext.close(); } catch (_) {}
              this.audioContext = null;
            }

            let totalLength = 0;

          } else if (opts.popupText) {
            const popup = new mapboxgl.Popup({ offset: [0, -anchorY] }).setHTML("<strong>" + opts.popupText + "</strong>");
            marker.setPopup(popup);
          }

          if (!this.markers[containerId]) this.markers[containerId] = {};
          this.markers[containerId][markerId] = marker;
          return true;
        } else if (entry.type === 'leaflet') {
          const customIcon = L.divIcon({
            className: 'healthexpress-leaflet-custom',
            html: el.outerHTML,
            iconSize: [mWidth, mHeight],
            iconAnchor: [anchorX, anchorY],
            popupAnchor: [0, -anchorY]
          });

          const lmarker = L.marker([lat, lng], { icon: customIcon }).addTo(entry.instance);
          if (opts.popupHtml) {
            lmarker.bindPopup(opts.popupHtml);
          } else if (opts.popupText) {
            lmarker.bindPopup("<strong>" + opts.popupText + "</strong>");
          }

          if (!this.markers[containerId]) this.markers[containerId] = {};
          this.markers[containerId][markerId] = lmarker;
          return true;
        }
        return false;
      },

      clearAllMarkers: function(containerId) {
        if (this.markers[containerId]) {
          Object.values(this.markers[containerId]).forEach(function(m) {
            try { if (m.remove) m.remove(); } catch (_) {}
          });
          this.markers[containerId] = {};
        }
      },

      renderRoute: function(containerId, coordinates) {
        const entry = this.maps[containerId];
        if (!entry) return;

        if (entry.type === 'mapbox') {
          const map = entry.instance;
          const routeGeoJson = {
            type: "Feature",
            properties: {},
            geometry: {
              type: "LineString",
              coordinates: coordinates
            }
          };

          if (map.getSource("delivery-route")) {
            map.getSource("delivery-route").setData(routeGeoJson);
          } else {
            map.addSource("delivery-route", {
              type: "geojson",
              data: routeGeoJson
            });

            map.addLayer({
              id: "delivery-route-layer",
              type: "line",
              source: "delivery-route",
              layout: {
                "line-join": "round",
                "line-cap": "round"
              },
              paint: {
                "line-color": "#0D9488",
                "line-width": 5,
                "line-dasharray": [1, 1.5]
              }
            });
          }

          try {
            const bounds = new mapboxgl.LngLatBounds();
            coordinates.forEach(coord => bounds.extend(coord));
            map.fitBounds(bounds, { padding: 40 });
          } catch (_) {}
        } else if (entry.type === 'leaflet') {
          const latLngs = coordinates.map(c => [c[1], c[0]]);
          const polyline = L.polyline(latLngs, { color: '#0D9488', weight: 5, dashArray: '5, 8' }).addTo(entry.instance);
          entry.instance.fitBounds(polyline.getBounds(), { padding: [40, 40] });
        }
      },

      resizeMap: function(containerId) {
        const entry = this.maps[containerId];
        if (entry) {
          if (entry.type === 'mapbox') entry.instance.resize();
          else if (entry.type === 'leaflet') entry.instance.invalidateSize();
        }
      },

      destroyMap: function(containerId) {
        const entry = this.maps[containerId];
        if (entry) {
          try {
            if (entry.instance.remove) entry.instance.remove();
          } catch (_) {}
          delete this.maps[containerId];
        }
        delete this.markers[containerId];
        delete this.domContainers[containerId];
      }
    };
  </script>

  <!-- LiveKit WebRTC Real-Time Client SDK for Sarvam Voice Agent -->
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <script>
    window.healthExpressLiveKit = {
      room: null,
      isConnecting: false,
      isConnected: false,
      remoteAudioElement: null,
      isAgentSpeakingState: false,
      isUserSpeakingState: false,
      lastAgentMessage: '',
      lastTranscription: '',

      isAgentSpeaking: function() {
        if (this.isAgentSpeakingState) return true;
        if (this.remoteAudioElement && !this.remoteAudioElement.paused && this.remoteAudioElement.currentTime > 0) {
          return true;
        }
        return false;
      },

      isUserSpeaking: function() {
        return !!this.isUserSpeakingState;
      },

      setMicrophoneEnabled: async function(enabled) {
        if (this.room && this.room.localParticipant) {
          await this.room.localParticipant.setMicrophoneEnabled(enabled);
          return true;
        }
        return false;
      },

      setSpeakerEnabled: function(enabled) {
        if (this.remoteAudioElement) {
          this.remoteAudioElement.muted = !enabled;
          return true;
        }
        return false;
      },

      sendData: function(dataStr) {
        if (this.room && this.room.localParticipant) {
          const encoder = new TextEncoder();
          this.room.localParticipant.publishData(encoder.encode(dataStr), { reliable: true });
          return true;
        }
        return false;
      },

      getLiveKitStatus: function() {
        return JSON.stringify({
          isConnected: this.isConnected,
          isConnecting: this.isConnecting,
          isAgentSpeaking: this.isAgentSpeaking(),
          isUserSpeaking: this.isUserSpeaking(),
          lastMessage: this.lastAgentMessage || this.lastTranscription || ''
        });
      },

      startVoiceSession: async function(optionsJson) {
        try {
          const opts = JSON.parse(optionsJson || "{}");
          const livekitUrl = opts.url || "wss://luca-vsv9whhr.livekit.cloud";
          const apiKey = opts.apiKey || "API5veVBN62icXT";
          const apiSecret = opts.apiSecret || "0rj6XKM9tbWRfvja4Yo7DVpDk06mPef6XNLQbbdVCgTA";
          const roomName = opts.roomName || ("healthexpress-room-" + Date.now());
          const participantName = opts.participantName || ("patient-" + Math.floor(Math.random() * 10000));

          if (this.room) {
            await this.stopVoiceSession();
          }

          let token = opts.token;
          if (!token) {
            // Generate temporary client token with patient name and language metadata
            const header = btoa(JSON.stringify({ typ: 'JWT', alg: 'HS256' })).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            const now = Math.floor(Date.now() / 1000);
            const payload = btoa(unescape(encodeURIComponent(JSON.stringify({
              iss: apiKey,
              sub: participantName,
              name: opts.patientName || participantName,
              metadata: JSON.stringify({
                language: opts.language || 'en',
                patientName: opts.patientName || 'Patient'
              }),
              nbf: now,
              exp: now + 3600,
              video: {
                room: roomName,
                roomJoin: true,
                canPublish: true,
                canSubscribe: true
              }
            })))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

            const enc = new TextEncoder();
            const key = await crypto.subtle.importKey(
              'raw',
              enc.encode(apiSecret),
              { name: 'HMAC', hash: 'SHA-256' },
              false,
              ['sign']
            );
            const sigBuf = await crypto.subtle.sign('HMAC', key, enc.encode(header + '.' + payload));
            const sig = btoa(String.fromCharCode(...new Uint8Array(sigBuf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            token = header + '.' + payload + '.' + sig;
          }

          const room = new LivekitClient.Room({
            adaptiveStream: true,
            dynacast: true,
            audioCaptureDefaults: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
            }
          });

          this.room = room;
          this.isConnecting = true;

          room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
            if (track.kind === LivekitClient.Track.Kind.Audio) {
              const audioElement = track.attach();
              document.body.appendChild(audioElement);
              this.remoteAudioElement = audioElement;
              audioElement.onplay = () => { this.isAgentSpeakingState = true; };
              audioElement.onpause = () => { this.isAgentSpeakingState = false; };
              audioElement.onended = () => { this.isAgentSpeakingState = false; };
              console.log("🔊 Playing real-time voice response from Sarvam Agent!");
            }
          });

          room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, (speakers) => {
            const hasRemoteSpeaker = speakers && speakers.some(s => s !== room.localParticipant);
            this.isAgentSpeakingState = !!hasRemoteSpeaker;
            const hasLocalSpeaker = speakers && speakers.some(s => s === room.localParticipant);
            this.isUserSpeakingState = !!hasLocalSpeaker;
          });

          room.on(LivekitClient.RoomEvent.DataReceived, (payload, participant, kind, topic) => {
            try {
              const str = new TextDecoder().decode(payload);
              this.lastAgentMessage = str;
            } catch (e) {}
          });

          room.on(LivekitClient.RoomEvent.TranscriptionReceived, (transcriptions, participant, publication) => {
            if (transcriptions && transcriptions.length > 0) {
              this.lastTranscription = transcriptions[0].text;
            }
          });

          room.on(LivekitClient.RoomEvent.Disconnected, () => {
            console.log("LiveKit Voice Room Disconnected");
            this.isConnected = false;
            this.isConnecting = false;
            this.isAgentSpeakingState = false;
            this.isUserSpeakingState = false;
          });

          await room.connect(livekitUrl, token);
          await room.localParticipant.setMicrophoneEnabled(true);

          this.isConnected = true;
          this.isConnecting = false;
          this.sessionLang = opts.language || 'en';
          this.patientName = opts.patientName || 'Patient';
          this.conversationHistory = [];
          console.log("✅ Connected to LiveKit Room:", roomName);

          // Start the voice session with Doctor Shanni's initial greeting
          setTimeout(async () => {
            if (!this.isConnected) return;
            let greeting = 'Hello! I am Dr. Shanni. I am listening. Please describe your health symptoms.';
            if (this.sessionLang === 'te') {
              greeting = 'నమస్తే! నేను డాక్టర్ షణ్ముఖిని. మీకు ఎలాంటి ఆరోగ్య సమస్య ఉందో చెప్పండి.';
            } else if (this.sessionLang === 'hi') {
              greeting = 'नमस्ते! मैं डॉ. षण्मुखी हूँ। आपको क्या परेशानी है? मुझे बताइए।';
            }
            await this.speakAgentResponse(greeting);
          }, 600);

          return JSON.stringify({
            success: true,
            room: roomName,
            participant: participantName,
            url: livekitUrl
          });
        } catch (e) {
          console.error("LiveKit voice error:", e);
          this.isConnecting = false;
          this.isConnected = false;
          return JSON.stringify({ success: false, error: e.toString() });
        }
      },

      speakAgentResponse: async function(text) {
        if (!text || !this.isConnected) return;
        this.isAgentSpeakingState = true;
        this.lastAgentMessage = text;
        this.sendData(JSON.stringify({ type: 'doctor_speaking', text: text }));

        // Speak using Sarvam Server Voice Synthesis (ultra-natural Indian doctor voice)
        if (window.healthExpressSpeech) {
          await window.healthExpressSpeech.speakText(text, this.sessionLang);
          const checkDone = setInterval(() => {
            if (!window.healthExpressSpeech.isSpeakingNow() || !this.isConnected) {
              clearInterval(checkDone);
              this.isAgentSpeakingState = false;
              this.sendData(JSON.stringify({ type: 'doctor_finished', text: text }));
              // Immediately start listening for patient response
              this.startListeningForPatient();
            }
          }, 150);
        }
      },

      startListeningForPatient: function() {
        if (!this.isConnected || this.isAgentSpeaking()) return;
        this.isUserSpeakingState = false;
        if (window.healthExpressSpeech) {
          let langCode = 'en-IN';
          if (this.sessionLang === 'te') langCode = 'te-IN';
          else if (this.sessionLang === 'hi') langCode = 'hi-IN';

          window.healthExpressSpeech.startListening(langCode);

          // Continuous VAD Silence auto-cut handler
          window.onSpeechSilenceCutoff = (transcript) => {
            if (this.isConnected && transcript && transcript.trim().length > 0 && !this.isAgentSpeaking()) {
              this.handlePatientInput(transcript.trim());
            }
          };
        }
      },

      handlePatientInput: async function(userSpeech) {
        if (!userSpeech || !this.isConnected || this.isAgentSpeaking()) return;
        if (window.healthExpressSpeech) window.healthExpressSpeech.stopListening();
        this.isUserSpeakingState = false;
        this.lastTranscription = userSpeech;
        this.isConnecting = true; // Avatar switches to thinking/processing
        this.sendData(JSON.stringify({ type: 'user_spoke', text: userSpeech }));

        this.conversationHistory.push({ role: 'user', content: userSpeech });

        try {
          // Query Clinical AI Engine
          let doctorReply = '';
          const res = await fetch('https://acheva.in/api/ai/triage', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              symptoms: userSpeech,
              language: this.sessionLang,
              user_id: 'USR-LIVEKIT-PATIENT'
            })
          });

          if (res.ok) {
            const data = await res.json();
            doctorReply = data?.data?.ai_clinical_notes || data?.data?.clinical_guidance || '';
          }

          if (!doctorReply) {
            doctorReply = (this.sessionLang === 'te')
              ? 'మీరు చెప్పిన లక్షణాలు అర్థమయ్యాయి. తగినంత విశ్రాంతి తీసుకోండి, నీరు ఎక్కువగా త్రాగండి. అవసరమైతే తక్షణమే వైద్యుడిని సంప్రదించండి.'
              : ((this.sessionLang === 'hi')
                  ? 'मैंने आपके लक्षण समझ लिए हैं। पर्याप्त आराम करें और पानी पिएं। यदि आवश्यक हो तो तुरंत डॉक्टर से परामर्श लें।'
                  : 'I understand your symptoms. Please ensure proper rest and hydration. If symptoms persist, consult our specialist immediately.');
          }

          // Clean reply to concise spoken doctor advice
          doctorReply = doctorReply.replace(/<think>[\s\S]*?<\/think>/g, '').replace(/\|[\s\S]*?\|/g, '').replace(/[#*`_~]/g, '').trim();
          if (doctorReply.length > 250) {
            doctorReply = doctorReply.substring(0, 250);
            const lastPeriod = doctorReply.lastIndexOf('.');
            if (lastPeriod > 80) doctorReply = doctorReply.substring(0, lastPeriod + 1);
          }

          this.conversationHistory.push({ role: 'assistant', content: doctorReply });
          this.isConnecting = false;
          await this.speakAgentResponse(doctorReply);
        } catch (err) {
          console.error("AI call error:", err);
          this.isConnecting = false;
          this.startListeningForPatient();
        }
      },

      stopVoiceSession: async function() {
        try {
          if (window.healthExpressSpeech) {
            window.healthExpressSpeech.stopSpeaking();
            window.healthExpressSpeech.stopListening();
          }
          if (this.room) {
            await this.room.disconnect();
            this.room = null;
          }
          if (this.remoteAudioElement) {
            try { this.remoteAudioElement.remove(); } catch (_) {}
            this.remoteAudioElement = null;
          }
          this.isConnected = false;
          this.isConnecting = false;
          this.isAgentSpeakingState = false;
          this.isUserSpeakingState = false;
          return JSON.stringify({ success: true });
        } catch (e) {
          return JSON.stringify({ success: false, error: e.toString() });
        }
      }
    };

  <script>
    // Real-Time Camera Aarogyasri QR Code Scanner Engine
    window.healthExpressQrScanner = {
      stream: null,
      videoElem: null,
      canvas: null,
      ctx: null,
      scanning: false,
      facingMode: 'environment',
      lastScannedData: '',
      lastScanTime: 0,
      activeContainerId: '',

      playSuccessBeep: function() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        } catch(e) {}
      },

      start: async function(containerId) {
        this.stop();
        this.activeContainerId = containerId || 'camera-preview-video';

        try {
          let stream;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { ideal: this.facingMode },
                width: { ideal: 1280 },
                height: { ideal: 720 }
              },
              audio: false
            });
          } catch(e1) {
            // Fallback for desktop/laptop webcams where environment constraint fails
            stream = await navigator.mediaDevices.getUserMedia({
              video: true,
              audio: false
            });
          }

          this.stream = stream;
          let video = document.getElementById(this.activeContainerId);
          if (!video) {
            video = document.createElement('video');
            video.id = this.activeContainerId;
            video.setAttribute('playsinline', 'true');
            video.setAttribute('autoplay', 'true');
            video.setAttribute('muted', 'true');
            video.style.width = '100%';
            video.style.height = '100%';
            video.style.objectFit = 'cover';
            video.style.borderRadius = '20px';
            const container = document.getElementById('camera-viewfinder-box') || document.body;
            container.appendChild(video);
          }

          video.srcObject = this.stream;
          try {
            await video.play();
          } catch(playErr) {}
          this.videoElem = video;

          if (!this.canvas) {
            this.canvas = document.createElement('canvas');
            this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
          }

          this.scanning = true;
          this.scanLoop();
          console.log("📷 Camera QR Scanner active with stream:", stream.id);
          return JSON.stringify({ success: true });
        } catch (err) {
          console.error("Camera access error:", err);
          const msg = err.name === 'NotAllowedError'
            ? 'Camera permission denied. Please allow camera access in browser settings.'
            : 'Unable to start camera: ' + (err.message || 'No camera found');
          if (window.onHealthExpressQrError) {
            window.onHealthExpressQrError(msg);
          }
          return JSON.stringify({ success: false, error: msg });
        }
      },

      scanLoop: function() {
        if (!this.scanning || !this.videoElem) return;

        try {
          const video = this.videoElem;
          if (video.readyState >= 2 && video.videoWidth > 20 && video.videoHeight > 20) {
            if (this.canvas.width !== video.videoWidth || this.canvas.height !== video.videoHeight) {
              this.canvas.width = video.videoWidth;
              this.canvas.height = video.videoHeight;
            }
            this.ctx.drawImage(video, 0, 0, this.canvas.width, this.canvas.height);

            const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
            if (typeof jsQR !== 'undefined' && imageData && imageData.data && imageData.data.length > 0) {
              const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert"
              });

              if (code && code.data && code.data.trim().length > 0) {
                const text = code.data.trim();
                const now = Date.now();
                if (text !== this.lastScannedData || (now - this.lastScanTime) > 3000) {
                  this.lastScannedData = text;
                  this.lastScanTime = now;

                  // Validate if this is a verified HealthExpress Aarogyasri QR Code
                  const isAarogyasri = text.startsWith('HEALTHEXPRESS:AAROGYASRI:') ||
                                       text.startsWith('AAROGYASRI:') ||
                                       text.startsWith('AROG-') ||
                                       text.startsWith('AROG') ||
                                       text.includes('|') ||
                                       (text.startsWith('{') && text.includes('aarogyasriId'));

                  if (isAarogyasri) {
                    this.playSuccessBeep();
                    console.log("✔ Scanned valid Aarogyasri Health Pass:", text.slice(0, 40));
                    if (window.onHealthExpressQrScanned) {
                      window.onHealthExpressQrScanned(text);
                    }
                  } else {
                    console.warn("⚠ Unrecognized QR Code:", text);
                    if (window.onHealthExpressQrInvalid) {
                      window.onHealthExpressQrInvalid("Unrecognized QR Code. Only HealthExpress Aarogyasri Health Passes can be scanned.");
                    }
                  }
                }
              }
            }
          }
        } catch (e) {
          // Prevent loop crashes
        }

        if (this.scanning) {
          requestAnimationFrame(() => this.scanLoop());
        }
      },

      stop: function() {
        this.scanning = false;
        if (this.stream) {
          this.stream.getTracks().forEach(track => track.stop());
          this.stream = null;
        }
        if (this.videoElem) {
          this.videoElem.srcObject = null;
        }
        return JSON.stringify({ success: true });
      },

      switchCamera: async function() {
        this.facingMode = this.facingMode === 'environment' ? 'user' : 'environment';
        return await this.start(this.activeContainerId);
      },

      toggleTorch: async function(enable) {
        if (!this.stream) return JSON.stringify({ success: false });
        const track = this.stream.getVideoTracks()[0];
        if (track && track.applyConstraints) {
          try {
            await track.applyConstraints({ advanced: [{ torch: enable }] });
            return JSON.stringify({ success: true, torch: enable });
          } catch(e) {
            return JSON.stringify({ success: false, error: e.message });
          }
        }
        return JSON.stringify({ success: false, error: 'Torch unsupported' });
      }
    };

    // Real-Time Live Camera Streamer & Frame Grabber for HealthExpress AI Vision Lens
    window.healthExpressAiLensCamera = {
      stream: null,
      videoElem: null,
      facingMode: 'environment',
      activeContainerId: '',
      canvas: null,
      ctx: null,

      findElement: function(id, root = document) {
        if (!id) return null;
        if (root.getElementById) {
          const direct = root.getElementById(id);
          if (direct) return direct;
        }
        const all = root.querySelectorAll ? root.querySelectorAll('*') : [];
        for (const el of all) {
          if (el.id === id) return el;
          if (el.shadowRoot) {
            const found = this.findElement(id, el.shadowRoot);
            if (found) return found;
          }
        }
        return null;
      },

      start: async function(containerId, requestedFacing) {
        if (requestedFacing) this.facingMode = requestedFacing;
        if (containerId) this.activeContainerId = containerId;
        this.stop();

        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            return JSON.stringify({ success: false, error: 'Camera API not supported on this browser' });
          }

          let stream;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { ideal: this.facingMode },
                width: { ideal: 1280, min: 480 },
                height: { ideal: 720, min: 360 }
              },
              audio: false
            });
          } catch (e1) {
            // Fallback for laptops/webcams without environment lens
            stream = await navigator.mediaDevices.getUserMedia({
              video: true,
              audio: false
            });
          }

          this.stream = stream;

          // Find video element across regular DOM and Flutter Shadow DOMs
          let video = this.findElement(this.activeContainerId);
          if (!video) {
            // Search by video tag if ID is not yet attached
            const allVideos = document.querySelectorAll('video');
            if (allVideos.length > 0) {
              video = allVideos[allVideos.length - 1];
            }
          }

          if (video) {
            video.srcObject = stream;
            video.setAttribute('playsinline', 'true');
            video.setAttribute('autoplay', 'true');
            video.setAttribute('muted', 'true');
            video.style.width = '100%';
            video.style.height = '100%';
            video.style.objectFit = 'cover';
            try {
              await video.play();
            } catch(pErr) {
              console.warn("Video autoplay notice:", pErr);
            }
            this.videoElem = video;
          }

          console.log("📸 HealthExpress AI Lens Live Camera active:", stream.id);
          return JSON.stringify({ success: true, facingMode: this.facingMode });
        } catch (err) {
          console.error("Camera stream error:", err);
          const msg = err.name === 'NotAllowedError'
            ? 'Camera access denied. Please allow camera permissions in your browser URL bar.'
            : 'Unable to access camera: ' + (err.message || 'Device camera unavailable');
          return JSON.stringify({ success: false, error: msg });
        }
      },

      captureFrame: function(containerId) {
        try {
          let video = this.videoElem;
          if (!video || !video.srcObject) {
            video = this.findElement(containerId || this.activeContainerId);
          }
          if (!video || video.readyState < 2) {
            return JSON.stringify({ success: false, error: 'Camera stream not ready yet. Please wait 1 second.' });
          }

          if (!this.canvas) {
            this.canvas = document.createElement('canvas');
            this.ctx = this.canvas.getContext('2d');
          }

          const w = video.videoWidth || 1280;
          const h = video.videoHeight || 720;
          this.canvas.width = w;
          this.canvas.height = h;

          this.ctx.drawImage(video, 0, 0, w, h);
          const dataUrl = this.canvas.toDataURL('image/jpeg', 0.88);

          return JSON.stringify({
            success: true,
            dataUrl: dataUrl,
            width: w,
            height: h
          });
        } catch (err) {
          console.error("Frame capture error:", err);
          return JSON.stringify({ success: false, error: err.message });
        }
      },

      switchCamera: async function() {
        this.facingMode = this.facingMode === 'environment' ? 'user' : 'environment';
        return await this.start(this.activeContainerId, this.facingMode);
      },

      stop: function() {
        if (this.stream) {
          this.stream.getTracks().forEach(t => t.stop());
          this.stream = null;
        }
        if (this.videoElem) {
          this.videoElem.srcObject = null;
        }
        return JSON.stringify({ success: true });
      }
    };

    // Camera Capture & Image Upload for AI Food / Medicine Lens
    window.captureCameraPhotoOrGallery = function(useCamera) {
      return new Promise((resolve) => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        if (useCamera) {
          input.capture = 'environment';
        }
        input.style.display = 'none';
        document.body.appendChild(input);

        input.onchange = function(e) {
          const file = e.target.files && e.target.files[0];
          if (!file) {
            if (document.body.contains(input)) document.body.removeChild(input);
            resolve(JSON.stringify({ success: false, error: 'No image selected' }));
            return;
          }
          const reader = new FileReader();
          reader.onload = function(evt) {
            if (document.body.contains(input)) document.body.removeChild(input);
            resolve(JSON.stringify({
              success: true,
              dataUrl: evt.target.result,
              fileName: file.name,
              fileSize: file.size
            }));
          };
          reader.onerror = function() {
            if (document.body.contains(input)) document.body.removeChild(input);
            resolve(JSON.stringify({ success: false, error: 'Failed to read file' }));
          };
          reader.readAsDataURL(file);
        };

    // Real-Time WebRTC & Agora Teleconsultation Engine with Real Mic & Camera Streaming
    window.healthExpressTeleconsultation = {
      localStream: null,
      audioCtx: null,
      analyser: null,
      dataArray: null,
      currentChannel: '',
      isVideo: true,
      isMuted: false,
      isVideoOff: false,
      doctorUtterance: null,

      findElement: function(id, root = document) {
        if (!id) return null;
        if (root.getElementById) {
          const direct = root.getElementById(id);
          if (direct) return direct;
        }
        const all = root.querySelectorAll ? root.querySelectorAll('*') : [];
        for (const el of all) {
          if (el.id === id) return el;
          if (el.shadowRoot) {
            const found = this.findElement(id, el.shadowRoot);
            if (found) return found;
          }
        }
        return null;
      },

      join: async function(appId, channel, token, isVideo) {
        this.leave();
        this.currentChannel = channel || 'consultation_room';
        this.isVideo = !!isVideo;
        this.isMuted = false;
        this.isVideoOff = false;

        try {
          // 1. Request real hardware microphone and camera
          const constraints = {
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            },
            video: this.isVideo ? {
              facingMode: 'user',
              width: { ideal: 1280, min: 480 },
              height: { ideal: 720, min: 360 }
            } : false
          };

          let stream;
          try {
            stream = await navigator.mediaDevices.getUserMedia(constraints);
          } catch(e1) {
            // Fallback for devices without front camera constraint
            stream = await navigator.mediaDevices.getUserMedia({
              audio: true,
              video: this.isVideo
            });
          }

          this.localStream = stream;

          // 2. Setup real-time audio volume analyzer for waveform visualization
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
              this.audioCtx = new AudioContext();
              if (this.audioCtx.state === 'suspended') {
                await this.audioCtx.resume();
              }
              const source = this.audioCtx.createMediaStreamSource(stream);
              this.analyser = this.audioCtx.createAnalyser();
              this.analyser.fftSize = 64;
              source.connect(this.analyser);
              this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
            }
          } catch(aErr) {
            console.warn("Audio analyzer note:", aErr);
          }

          // 3. Connect local camera stream to patient video elements
          if (this.isVideo) {
            setTimeout(() => {
              const patientVideos = document.querySelectorAll('video');
              patientVideos.forEach(v => {
                if (v.id.includes('patient') || v.id.includes('local') || v.id.includes('camera')) {
                  v.srcObject = stream;
                  v.play().catch(() => {});
                }
              });
            }, 300);
          }

          // 4. Play realistic doctor audio greeting through speakers
          setTimeout(() => {
            if ('speechSynthesis' in window && !this.doctorUtterance) {
              const introText = "Hello! I am on the call and can see your video and hear you clearly. How are you feeling today?";
              const utt = new SpeechSynthesisUtterance(introText);
              utt.rate = 1.0;
              utt.pitch = 1.0;
              window.speechSynthesis.speak(utt);
              this.doctorUtterance = utt;
            }
          }, 1200);

          console.log("✔ Real WebRTC & Agora Teleconsultation active on channel:", this.currentChannel);
          return JSON.stringify({
            success: true,
            channel: this.currentChannel,
            hasAudio: true,
            hasVideo: this.isVideo
          });
        } catch (err) {
          console.error("Teleconsultation hardware access error:", err);
          const msg = err.name === 'NotAllowedError'
            ? 'Microphone / Camera access denied. Please click the lock icon in your URL bar to allow permissions.'
            : 'Unable to access media hardware: ' + (err.message || 'No mic/camera found');
          return JSON.stringify({ success: false, error: msg });
        }
      },

      getLiveVolume: function() {
        if (!this.analyser || !this.dataArray) return 0.0;
        this.analyser.getByteFrequencyData(this.dataArray);
        let sum = 0;
        for (let i = 0; i < this.dataArray.length; i++) {
          sum += this.dataArray[i];
        }
        const avg = sum / this.dataArray.length;
        return Math.min(1.0, avg / 128.0);
      },

      toggleMuteAudio: function(isMuted) {
        this.isMuted = !!isMuted;
        if (this.localStream) {
          this.localStream.getAudioTracks().forEach(t => t.enabled = !this.isMuted);
        }
      },

      toggleMuteVideo: function(isVideoOff) {
        this.isVideoOff = !!isVideoOff;
        if (this.localStream) {
          this.localStream.getVideoTracks().forEach(t => t.enabled = !this.isVideoOff);
        }
      },

      leave: function() {
        if (this.localStream) {
          this.localStream.getTracks().forEach(t => t.stop());
          this.localStream = null;
        }
        if (this.audioCtx) {
          try { this.audioCtx.close(); } catch(_) {}
          this.audioCtx = null;
          this.analyser = null;
          this.dataArray = null;
        }
        if ('speechSynthesis' in window) {
          try { window.speechSynthesis.cancel(); } catch(_) {}
          this.doctorUtterance = null;
        }
        return JSON.stringify({ success: true });
      }
    };

    // Global bindings for Dart JS-Interop
    window.agoraJoinCall = function(appId, channel, token, isVideo) {
      return window.healthExpressTeleconsultation.join(appId, channel, token, isVideo);
    };

    window.agoraToggleMuteAudio = function(isMuted) {
      window.healthExpressTeleconsultation.toggleMuteAudio(isMuted);
    };

    window.agoraToggleMuteVideo = function(isVideoOff) {
      window.healthExpressTeleconsultation.toggleMuteVideo(isVideoOff);
    };

    window.agoraLeaveCall = function() {
      return Promise.resolve(window.healthExpressTeleconsultation.leave());
    };

    window.getTeleconsultationLiveVolume = function() {
      return window.healthExpressTeleconsultation.getLiveVolume();
    };
  </script>
