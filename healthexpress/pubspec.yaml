name: healthexpress
description: "Sanjeevani.AI — Edge-First Emergency Response & Healthcare Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  uuid: ^4.4.0
  http: ^1.2.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.4
  file_picker: ^8.1.3
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0
  llama_cpp_dart:
    path: .bob/llama_cpp_dart_0.9
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_contacts: ^2.6.0
  geolocator: ^14.0.2
  video_player: ^2.14.1
  video_player_win: ^3.3.1
  camera: ^0.12.1
  url_launcher: ^6.3.3
  audioplayers: ^6.8.1
  livekit_client: ^2.13.1
  permission_handler: 11.3.1
  dart_jsonwebtoken: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/splash/
    - assets/images/illustrations/
    - assets/images/quick_actions/
    - assets/models.json
    - assets/models/
    - hero/
    - assets/hero/
    - assets/reels/
    - assets/images/delivery/
    - assets/audio/
    - assets/.env
    - assets/data/
